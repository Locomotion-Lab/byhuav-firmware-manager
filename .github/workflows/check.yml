name: Offline checks
on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
env:
  # Match the UTF-8 environment set by both user-facing launchers.
  PYTHONUTF8: '1'
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify firmware payload
        run: python update.py --verify-package
      - name: Verify esptool runtime
        run: |
          python -m pip install -r requirements.txt
          python -m esptool version
      - name: Build distribution
        run: python tools/build_release.py
      - name: PowerShell launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @('Update.ps1', 'dist/Install.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          $env:BYHUAV_PIO_PYTHON = (Get-Command python).Source
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./Update.ps1 --verify-package
          if ($LASTEXITCODE -ne 0) { throw 'Windows launcher failed' }
      - name: Shell launcher syntax and launch
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n update.sh
          bash -n dist/install.sh
          BYHUAV_PIO_PYTHON="$(command -v python)" bash update.sh --verify-package
  online-entry:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify published Windows entry without hardware access
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:BYHUAV_PIO_PYTHON = (Get-Command python).Source
          Invoke-WebRequest 'https://github.com/Locomotion-Lab/byhuav-firmware-manager/releases/download/v0.1.0/Install.ps1' -OutFile "$env:RUNNER_TEMP/Install.ps1"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP/Install.ps1" --verify-package
          if ($LASTEXITCODE -ne 0) { throw 'Published Windows entry failed' }
      - name: Verify published shell entry without hardware access
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://github.com/Locomotion-Lab/byhuav-firmware-manager/releases/download/v0.1.0/install.sh -o "$RUNNER_TEMP/install.sh"
          BYHUAV_PIO_PYTHON="$(command -v python)" bash "$RUNNER_TEMP/install.sh" --verify-package
